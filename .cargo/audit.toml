# cargo-audit configuration.
#
# The advisories ignored below are either confined to the host-side developer /
# test toolchain that `cargo test` pulls in as dev-dependencies, or are direct
# Anchor toolchain dependencies with no compatible patched release. The deployed
# SBF artifact contains none of the host-only dependencies:
#
#     cargo tree -p clober -i <crate> -e no-dev   # empty for host-only entries
#     nm target/deploy/clober.so | grep -i <crate> # excludes build-only entries
#
# The deployed `clober.so` verifies signatures through Solana runtime
# syscalls and performs no networking, so the vulnerable code paths (ed25519
# double-signing oracle, curve25519 scalar-subtraction timing, quinn stream
# reassembly) are unreachable on-chain. The versions are pinned by the Solana
# 2.x / anchor toolchain and cannot be bumped without breaking that set.
#
# The gate deliberately ignores only these specific IDs, so any new advisory
# fails CI. Each exception is reviewed with the Anchor/Solana toolchain upgrade.

[advisories]
ignore = [
    # bincode 1.3.3 is selected by Anchor/Solana's account serialization stack.
    # RustSec marks it unmaintained, not vulnerable; no compatible patched line
    # exists. Revisit on the next Anchor toolchain upgrade.
    "RUSTSEC-2025-0141",
    # anyhow is used only by Anchor procedural macros during host compilation;
    # it is not linked into the deployed SBF artifact. The reported unsound API
    # is unavailable to the on-chain program.
    "RUSTSEC-2026-0190",
    # The remaining warnings are transitive Solana program-test dependencies.
    # They are host-only and absent from `cargo tree -p clober -e no-dev`.
    "RUSTSEC-2024-0388",
    "RUSTSEC-2025-0161",
    "RUSTSEC-2024-0436",
    "RUSTSEC-2026-0173",
    "RUSTSEC-2026-0186",
    "RUSTSEC-2026-0097",
    # curve25519-dalek 3.2.0 — Scalar sub timing variability. Dev/test tree only
    # (solana host crypto); not linked into the program. Patched in >=4.1.3,
    # which the pinned Solana 2.x stack does not yet use.
    "RUSTSEC-2024-0344",
    # ed25519-dalek 1.0.1 — double public-key signing oracle. Dev/test tree only;
    # the program never signs (it verifies via syscalls). Patched in >=2.
    "RUSTSEC-2022-0093",
    # quinn-proto 0.11.14 — remote memory exhaustion in QUIC stream reassembly.
    # Reachable only from the host RPC/client networking stack; the on-chain
    # program does no networking. Patched in >=0.11.15.
    "RUSTSEC-2026-0185",
    # crossbeam-epoch 0.9.18 — invalid pointer dereference in the `fmt::Pointer`
    # impl for `Atomic`/`Shared`. Dev/test tree only: pulled solely via
    # solana-program-test → solana-client → solana-streamer → governor → dashmap
    # → rayon (a dev-dependency); `cargo tree -p clober -i crossbeam-epoch
    # -e no-dev` is empty and it is not linked into clober.so. The vulnerable
    # path only triggers when formatting an already-invalid atomic pointer, which
    # the test harness never does. Pinned by the Solana 3.x stack.
    "RUSTSEC-2026-0204",
]
