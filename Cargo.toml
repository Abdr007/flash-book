[workspace]
resolver = "2"
members = ["programs/*"]
exclude = ["programs/flash-book-pin"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Abdr007/flash-book"

[workspace.dependencies]
anchor-lang = "1.0.0"
anchor-spl = "1.0.0"
# MagicBlock ER delegation: implemented in-house via raw invoke_signed
# (programs/flash-book/src/er.rs) because the ephemeral-rollups-sdk and
# magicblock-delegation-program-api crates pin solana-instruction ^3.0
# / solana-pubkey ^3.0 (incompatible with our spl-token v6 stack on
# solana 2.1.x). The hand-rolled CPI uses only the well-documented
# delegation program ID + Borsh DelegateArgs layout — version-agnostic.
# borsh is re-exported via anchor_lang::prelude — do NOT add it as a
# top-level dep; it triggers a derive-macro ambiguity error.
bytemuck = { version = "1.23", features = ["derive"] }
thiserror = "2.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
