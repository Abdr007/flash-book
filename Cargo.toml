[workspace]
resolver = "2"
members = ["programs/*"]
# Certora verification harness — standalone (never built by normal workspace CI;
# path-depends on flash-book with the certora feature). See its Cargo.toml.
exclude = ["certora/harness-crate"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Abdr007/flash-book"

[workspace.dependencies]
anchor-lang = "1.0.0"
anchor-spl = "1.0.0"
# MagicBlock ER delegation CPIs are issued directly via invoke_signed
# (programs/flash-book/src/er.rs) against the delegation program's stable
# instruction ABI; the SDK crates require solana-instruction/solana-pubkey
# ^3.0, which conflicts with the spl-token v6 / solana 2.1 dependency set.
# borsh is consumed through anchor_lang::prelude; adding it as a direct
# dependency creates a derive-macro ambiguity.
bytemuck = { version = "1.23", features = ["derive"] }
thiserror = "2.0"
# Certora Solana Prover SDK — verification-only, pulled ONLY under the
# `certora` feature (never in the product/CI build path). Public crates.
cvlr = { git = "https://github.com/Certora/cvlr", tag = "cvlr-v0.6.1" }
cvlr-solana = { git = "https://github.com/Certora/cvlr-solana", tag = "cvlr-solana-v0.5.0" }
# aliased as `nondet` — the pre-existing hypertree certora instrumentation
# (red_black_tree.rs / hypertree.rs) refers to the crate by that bare name.
nondet = { package = "cvlr-nondet", git = "https://github.com/Certora/cvlr", tag = "cvlr-v0.6.1" }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
