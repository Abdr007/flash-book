[workspace]
resolver = "2"
members = ["programs/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Abdr007/flash-book"

[workspace.dependencies]
anchor-lang = "0.31.1"
anchor-spl = "0.31.1"
# ephemeral-rollups-sdk: tried 0.2 (Solana 1.x compat issues) and 0.13
# (current Solana 2.x type mismatches in invoke_signed). Both blocked
# upstream. Tracked. Integration is purely additive — when the SDK
# stabilizes against Solana 2.x, it slots in here without semantic
# changes to existing instructions.
# borsh is re-exported via anchor_lang::prelude — do NOT add it as a
# top-level dep; it triggers a derive-macro ambiguity error.
bytemuck = { version = "1.21", features = ["derive"] }
thiserror = "2.0"

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
incremental = false

[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
