name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust on-chain program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Check
        run: cargo check -p flash-book
      # The integration suite loads the program as a real compiled SBF .so and
      # runs it in the BPF VM (not an in-process processor), so the artifact must
      # exist and be discoverable via SBF_OUT_DIR before `cargo test` runs.
      - name: Build SBF .so (integration tests load it as bytecode)
        run: cargo build-sbf --tools-version v1.52 --manifest-path programs/flash-book/Cargo.toml --sbf-out-dir target/deploy
      - name: Lib + integration tests
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
        run: cargo test -p flash-book
      - name: Run all proptest suites
        run: |
          cargo test -p flash-book --test proptest_risk
          cargo test -p flash-book --test proptest_isolated
          cargo test -p flash-book --test proptest_liquidation
          cargo test -p flash-book --test proptest_new_features
          cargo test -p flash-book --test proptest_modules
          cargo test -p flash-book --test proptest_haircut
          cargo test -p flash-book --test proptest_envelope
          cargo test -p flash-book --test proptest_book
      - name: Run all module-integration tests
        run: |
          cargo test -p flash-book --test haircut_ix
          cargo test -p flash-book --test haircut_release
          cargo test -p flash-book --test haircut_apply_fill
          cargo test -p flash-book --test haircut_invariants_side_accrual
          cargo test -p flash-book --test envelope_ix
          cargo test -p flash-book --test envelope_runtime_gate
          cargo test -p flash-book --test trigger_slippage

  sbf:
    name: cargo build-sbf (BPF release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Build SBF
        run: cargo build-sbf --tools-version v1.52 --manifest-path programs/flash-book/Cargo.toml --sbf-out-dir target/deploy
      # Upload the built .so so it can be downloaded and deployed to devnet.
      # platform-tools v1.52 (rustc 1.89) is required: earlier releases cannot
      # compile edition2024 dependencies.
      - name: Upload flash_book.so
        uses: actions/upload-artifact@v4
        with:
          name: flash_book-so
          path: target/deploy/flash_book.so
          if-no-files-found: error

  kani:
    name: Formal verification (Kani)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs the ENTIRE Kani suite (no --harness filter) across haircut, lib
      # (solvency + margin-frame proofs), risk (MMR), fill_commitment (ring +
      # nonce), flp_quoter (price band), liquidation (worse-of), insurance
      # (solvency), state_v2 (order-id price-time priority) and the ER-liveness
      # / order-id-seq proofs. See docs/FORMAL_VERIFICATION.md +
      # certora/PROPERTIES.md. A regression that breaks any invariant fails CI.
      - name: Run Kani proof harnesses
        uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: 0.67.0
          args: '--package flash-book --features no-entrypoint'

  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain: a `-D warnings` clippy gate on a floating `@stable`
      # breaks whenever a new Rust release adds a lint that fires on existing
      # code. Pin to the version the tree is validated against; bump deliberately.
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories confined to the host dev/test toolchain are ignored with a
      # per-ID justification in .cargo/audit.toml (none are normal/build deps of
      # the program, none are linked into the deployed .so). Any NEW advisory —
      # or any of those reaching the program's non-dev tree — fails the gate.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit

  idl-drift:
    name: IDL drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned to the toolchain the committed IDL was generated with, so
      # `anchor idl build` is reproducible run-to-run.
      - uses: dtolnay/rust-toolchain@1.89.0
      - uses: Swatinem/rust-cache@v2
      # anchor-cli links against libudev (via hidapi); the runner needs the dev
      # package + pkg-config before `cargo install`.
      - name: Install anchor-cli build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Install Anchor CLI
        run: cargo install anchor-cli --version 0.32.1 --locked
      # Rebuild the IDL from source and fail if it diverges from the committed
      # idl/flash_book.json (the documented source of truth). Catches any account
      # / arg / discriminator / event / error change that was not regenerated.
      - name: Build IDL from source
        run: anchor idl build -o /tmp/fresh-idl.json
      - name: Compare against committed IDL
        run: node scripts/check-idl-drift.mjs idl/flash_book.json /tmp/fresh-idl.json

  lean:
    name: Formal verification (Lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the Lean theorems (Haircut/OiMmr/Funding) at the real divisors —
      # the cases CBMC can't reach (non-pow2 division, 128-bit multiply). Uses the
      # prebuilt Mathlib cache so the job is minutes, not an hour. A `sorry` or a
      # broken proof fails the build. See formal_verification/lean/README.md.
      - name: Build Lean proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal_verification/lean
          use-mathlib-cache: true
