name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust on-chain program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Check
        run: cargo check -p clober
      # The integration suite loads the program as a real compiled SBF .so and
      # runs it in the BPF VM (not an in-process processor), so the artifact must
      # exist and be discoverable via SBF_OUT_DIR before `cargo test` runs.
      - name: Build SBF .so (integration tests load it as bytecode)
        run: cargo build-sbf --tools-version v1.52 --manifest-path programs/clober/Cargo.toml --sbf-out-dir target/deploy
      - name: Lib + integration tests
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
        run: cargo test -p clober
      - name: Run all proptest suites
        run: |
          cargo test -p clober --test proptest_risk
          cargo test -p clober --test proptest_isolated
          cargo test -p clober --test proptest_liquidation
          cargo test -p clober --test proptest_new_features
          cargo test -p clober --test proptest_modules
          cargo test -p clober --test proptest_haircut
          cargo test -p clober --test proptest_envelope
          cargo test -p clober --test proptest_book
      - name: Run all module-integration tests
        run: |
          cargo test -p clober --test haircut_ix
          cargo test -p clober --test haircut_release
          cargo test -p clober --test haircut_apply_fill
          cargo test -p clober --test haircut_invariants_side_accrual
          cargo test -p clober --test envelope_ix
          cargo test -p clober --test envelope_runtime_gate
          cargo test -p clober --test trigger_slippage

  sbf:
    name: cargo build-sbf (BPF release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Build SBF
        run: cargo build-sbf --tools-version v1.52 --manifest-path programs/clober/Cargo.toml --sbf-out-dir target/deploy
      # Upload the built .so so it can be downloaded and deployed to devnet.
      # platform-tools v1.52 (rustc 1.89) is required: earlier releases cannot
      # compile edition2024 dependencies.
      - name: Upload clober.so
        uses: actions/upload-artifact@v4
        with:
          name: clober-so
          path: target/deploy/clober.so
          if-no-files-found: error

  kani:
    name: Formal verification (Kani)
    runs-on: ubuntu-latest
    # Fail fast on a pathologically-slow proof instead of hanging to the 6h job
    # default. A legitimate full run (cold compile + all harnesses) completes in
    # ~10-15 min; a proof that forces CBMC to bit-blast a symbolic 128-bit divider
    # does not terminate (see the `incremental_im` / OI-breaker / funding notes).
    # 90 min leaves generous headroom over a real run while capping such a hang.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs the ENTIRE Kani suite (no --harness filter) across haircut, lib
      # (solvency + margin-frame proofs), risk (MMR), fill_commitment (ring +
      # nonce), lp_quoter (price band), liquidation (worse-of), insurance
      # (solvency), book_state (order-id price-time priority) and the ER-liveness
      # / order-id-seq proofs. See docs/FORMAL_VERIFICATION.md +
      # certora/PROPERTIES.md. A regression that breaks any invariant fails CI.
      - name: Run Kani proof harnesses
        uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: 0.67.0
          args: '--package clober --features no-entrypoint'

  lint:
    name: Format + Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Pinned toolchain: a `-D warnings` clippy gate on a floating `@stable`
      # breaks whenever a new Rust release adds a lint that fires on existing
      # code. Pin to the version the tree is validated against; bump deliberately.
      - uses: dtolnay/rust-toolchain@1.89.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: clippy (deny warnings)
        run: cargo clippy --all-targets -- -D warnings

  audit:
    name: Dependency audit (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Advisories confined to the host dev/test toolchain are ignored with a
      # per-ID justification in .cargo/audit.toml (none are normal/build deps of
      # the program, none are linked into the deployed .so). Any NEW advisory —
      # or any of those reaching the program's non-dev tree — fails the gate.
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      - name: cargo audit
        run: cargo audit --deny warnings

  idl-drift:
    name: IDL drift gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # AVM's locked dependency graph requires Rust 1.91 or newer. This is the
      # host compiler for the reproducible IDL generator only; SBF is pinned
      # separately in its build commands.
      - uses: dtolnay/rust-toolchain@1.91.0
      - uses: Swatinem/rust-cache@v2
      # anchor-cli links against libudev (via hidapi); the runner needs the dev
      # package + pkg-config before `cargo install`.
      - name: Install anchor-cli build deps
        run: sudo apt-get update && sudo apt-get install -y pkg-config libudev-dev
      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Install Anchor Version Manager
        run: cargo install --git https://github.com/coral-xyz/anchor avm --locked
      - name: Install matching Anchor CLI
        run: avm install 1.1.2
      # Rebuild the IDL from source and fail if it diverges from the committed
      # idl/clober.json (the documented source of truth). Catches any account
      # / arg / discriminator / event / error change that was not regenerated.
      - name: Build IDL from source
        run: anchor idl build -o /tmp/fresh-idl.json
      - name: Compare against committed IDL
        run: node scripts/check-idl-drift.mjs idl/clober.json /tmp/fresh-idl.json

  market-catalog:
    name: Mainnet market catalog
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate launch market configuration
        run: node scripts/validate-market-catalog.mjs

  lean:
    name: Formal verification (Lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the Lean theorems (Haircut/OiMmr/Funding) at the real divisors —
      # the cases CBMC can't reach (non-pow2 division, 128-bit multiply). Uses the
      # prebuilt Mathlib cache so the job is minutes, not an hour. A `sorry` or a
      # broken proof fails the build. See formal_verification/lean/README.md.
      - name: Build Lean proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal_verification/lean
          use-mathlib-cache: true

  certora:
    # P-SOLV-4 solvency proof on the Certora Solana Prover. Runs the Rust
    # `#[rule]` harness (certora/harness/solvency_rules.rs) selected in
    # certora/solana_solvency.conf. CURRENT COVERAGE: the withdraw slice
    # (`solvency_preserved_simple_withdraw`) — solvency preserved against the
    # REAL `assess_solvency_full` invariant; verified non-vacuous on the cloud
    # Prover. NOT yet the full 19-handler parametric set (tracked; see the conf
    # + certora/harness/README.md). Gated on the Certora Solana license: without
    # CERTORAKEY the job transparently SKIPS (logging why) so forks/unlicensed
    # CI stay green — it is NOT a silent pass.
    name: Formal verification (Certora, licensed only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gate on Certora license
        id: gate
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
        run: |
          if [ -n "$CERTORAKEY" ]; then
            echo "licensed=true" >> "$GITHUB_OUTPUT"
          else
            echo "licensed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::CERTORAKEY not set — Certora solvency proof SKIPPED (the real harness verifies GREEN on the cloud Prover; this CI runner just lacks the license secret). This is not a pass."
          fi
      - if: steps.gate.outputs.licensed == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - if: steps.gate.outputs.licensed == 'true'
        name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"
      - if: steps.gate.outputs.licensed == 'true'
        name: Install Certora Solana toolchain
        run: |
          pip install certora-cli
          cargo install cargo-certora-sbf --version 0.3.5 --locked
      - if: steps.gate.outputs.licensed == 'true'
        name: Run P-SOLV-4 solvency proof (Certora Solana Prover)
        working-directory: certora/harness-crate
        env:
          CERTORAKEY: ${{ secrets.CERTORAKEY }}
        run: |
          # The harness is a SEPARATE crate (clober stays IDL-clean).
          # cargo-certora-sbf pulls Certora's platform-tools (v1.53-certora) and
          # emits the build manifest; certoraSolanaProver builds it (clober
          # with the certora feature) and runs the rule(s) in the conf on the
          # cloud Prover, failing CI on any violation or sanity failure.
          certoraSolanaProver "$GITHUB_WORKSPACE/certora/solana_solvency.conf" --wait_for_results
