name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  rust:
    name: Rust on-chain program
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Check
        run: cargo check -p flash-book
      # The integration suite loads the program as a real compiled SBF .so and
      # runs it in the BPF VM (not an in-process processor), so the artifact must
      # exist and be discoverable via SBF_OUT_DIR before `cargo test` runs.
      - name: Build SBF .so (integration tests load it as bytecode)
        run: cargo build-sbf --manifest-path programs/flash-book/Cargo.toml --sbf-out-dir target/deploy
      - name: Lib + integration tests
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/target/deploy
        run: cargo test -p flash-book
      - name: Run all proptest suites
        run: |
          cargo test -p flash-book --test proptest_risk
          cargo test -p flash-book --test proptest_isolated
          cargo test -p flash-book --test proptest_liquidation
          cargo test -p flash-book --test proptest_new_features
          cargo test -p flash-book --test proptest_modules
          cargo test -p flash-book --test proptest_haircut
          cargo test -p flash-book --test proptest_envelope
          cargo test -p flash-book --test proptest_book
      - name: Run all wave-integration tests
        run: |
          cargo test -p flash-book --test wave24b_haircut_ix
          cargo test -p flash-book --test wave24c_release
          cargo test -p flash-book --test wave24d_apply_fill_haircut
          cargo test -p flash-book --test wave24e_25a
          cargo test -p flash-book --test wave26a_envelope_ix
          cargo test -p flash-book --test wave26b_runtime_gate
          cargo test -p flash-book --test wave27a_trigger_slippage

  sbf:
    name: cargo build-sbf (BPF release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install Solana toolchain
        run: |
          sh -c "$(curl -sSfL https://release.anza.xyz/stable/install)"
          echo "$HOME/.local/share/solana/install/active_release/bin" >> $GITHUB_PATH
      - name: Build SBF
        run: cargo build-sbf --manifest-path programs/flash-book/Cargo.toml --sbf-out-dir target/deploy
      # Upload the built .so so it can be downloaded and deployed to devnet
      # (local `cargo build-sbf` is blocked by a toolchain edition2024 issue).
      - name: Upload flash_book.so
        uses: actions/upload-artifact@v4
        with:
          name: flash_book-so
          path: target/deploy/flash_book.so
          if-no-files-found: error
      - name: Build SBF (Pinocchio migration crate, WIP)
        run: cargo build-sbf --manifest-path programs/flash-book-pin/Cargo.toml
      # Runs BOTH the host equivalence tests (--lib) AND the on-validator
      # integration tests (tests/integration.rs), which load the .so built above
      # into the BPF VM via solana-program-test. SBF_OUT_DIR points at the
      # build-sbf output so ProgramTest finds `flash_book_pin.so`.
      - name: Test Pinocchio migration crate (host + on-validator integration)
        env:
          SBF_OUT_DIR: ${{ github.workspace }}/programs/flash-book-pin/target/deploy
        run: cargo test --manifest-path programs/flash-book-pin/Cargo.toml

  kani:
    name: Formal verification (Kani)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Runs the ENTIRE Kani suite (no --harness filter): 44 harnesses across
      # haircut, lib (h6/h7 solvency + the C-1 margin-frame proofs), risk (MMR),
      # fill_commitment (ring + nonce), flp_quoter (price band), liquidation
      # (worse-of), insurance (solvency), state_v2 (order-id price-time priority)
      # and the ER-liveness / order-id-seq remediation proofs. See
      # docs/FORMAL_VERIFICATION.md + certora/PROPERTIES.md. A regression that
      # breaks any invariant fails CI.
      - name: Run Kani proof harnesses (all 44)
        uses: model-checking/kani-github-action@v1.1
        with:
          kani-version: 0.67.0
          args: '--package flash-book --features no-entrypoint'
      # The Pinocchio migration crate is its own (isolated) workspace, so its
      # proofs need a separate invocation. 25 harnesses: haircut solvency/dust +
      # OI conservation + vault share-mint + perf-fee + xmargin (ER floor + epoch
      # monotonic) + force-undelegate (never-fires-while-live) + the fill-commit
      # ring/nonce + order-id collision-freedom/price-priority under the seq
      # ceiling (audit 2026-06) + others across the now-complete 134/134 port.
      # Run via a plain
      # `cargo kani` (NOT a second action invocation) so we reuse the Kani the
      # step above already installed — re-invoking the action re-runs its full
      # install (~4 min wasted). Same job ⇒ pin proofs stay part of the REQUIRED
      # "Formal verification (Kani)" check (enforced, not advisory).
      - name: Run Kani proof harnesses (Pinocchio migration crate)
        run: cargo kani --manifest-path programs/flash-book-pin/Cargo.toml

  lean:
    name: Formal verification (Lean)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Builds the 7 Lean theorems (Haircut/OiMmr/Funding) at the real divisors —
      # the cases CBMC can't reach (non-pow2 division, 128-bit multiply). Uses the
      # prebuilt Mathlib cache so the job is minutes, not an hour. A `sorry` or a
      # broken proof fails the build. See formal_verification/lean/README.md.
      - name: Build Lean proofs
        uses: leanprover/lean-action@v1
        with:
          lake-package-directory: formal_verification/lean
          use-mathlib-cache: true
