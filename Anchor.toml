[features]
resolution = true
skip-lint = false

# Build the SBF artifact with `cargo build-sbf --tools-version v1.52`
# (platform-tools v1.52 = rustc 1.89; earlier releases cannot compile
# edition2024 dependencies). The integration suite loads the compiled .so:
# run tests with SBF_OUT_DIR=<repo>/target/deploy.

[programs.localnet]
clober = "5VqBguVaSj8PH6BTk9X5s3nJCHRqAkZfB7G7Bjenzcq"

[programs.devnet]
clober = "5VqBguVaSj8PH6BTk9X5s3nJCHRqAkZfB7G7Bjenzcq"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "cargo test -p clober"

[workspace]
members = [
    "programs/clober",
]
