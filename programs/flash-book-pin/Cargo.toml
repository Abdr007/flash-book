# Pinocchio migration target (flash-book V2). Isolated workspace so it never
# affects the Anchor program's build/lockfile. See docs/QUASAR_MIGRATION_SCOPE.md.
[workspace]

[package]
name = "flash-book-pin"
version = "0.0.0"
edition = "2021"
description = "Pinocchio (zero-copy, zero-alloc) port of the Flash Book orderbook — WIP migration."

[lib]
crate-type = ["cdylib", "lib"]

[dependencies]
pinocchio = "=0.8.4"
bytemuck = { version = "1", features = ["min_const_generics", "derive"] }

[profile.release]
overflow-checks = true
lto = "fat"
codegen-units = 1
panic = "abort"

[dev-dependencies]
solana-program-test = { version = "3.1", features = ["agave-unstable-api"] }
solana-sdk = "3.0"
tokio = { version = "1", features = ["full"] }
# Pin the transitive transaction-error to 3.2.0 — 3.3.0 added a variant
# solana-runtime 3.1.12 does not match (non-exhaustive compile error).
solana-transaction-error = "=3.2.0"
