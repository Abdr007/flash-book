[package]
name = "flash-book"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Flash Book — pool-backed CLOB matched by FBA on MagicBlock ER."

[lib]
crate-type = ["cdylib", "lib"]
name = "flash_book"

[features]
default = []
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = { workspace = true, features = ["init-if-needed"] }
anchor-spl = { workspace = true }
bytemuck = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
proptest = "1.6"
# solana-program-test integration tests are blocked by an upstream
# lifetime-signature mismatch between Anchor 0.31's `entry` (which uses
# `'info` for both the slice and AccountInfo) and solana-program-test's
# expected HRTB `BuiltinFunctionWithContext` signature. Tracked; will
# revisit when Anchor releases a compat shim or we build BPF.
